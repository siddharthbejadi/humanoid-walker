# Experimental reference-assisted walking. Fresh policy, not a qualified teacher.
defaults:
  - walking_mjx_privileged_teacher_200k
  - _self_

logdir: ${oc.env:TEACHER_RUN_DIR,logdir/reference_pilot_20261012}
resume_from: null
init_from: null
transfer_from: null
allow_unverified_resume: false
init_from_action_scale_compensation: false

env:
  scene_path: envs/mjx_walking/assets/humanoid_rubber_2mm_servo_v2_kp40.xml
  env_num: 128
  steps: 1000000
  action_repeat: 10
  train_ratio: 64
  time_limit: 10000
  eval_episode_num: 32
  eval_repeatable: true
  eval_balanced_pose_ids: false
  eval_seed: 1000
  eval_pose_rsi: true
  eval_rsi_probabilities: [1.0, 0.0, 0.0, 0.0]
  mjx_task: walking
  mjx_reward_profile: goal_corridor_v3
  mjx_simplified_rewards: true
  mjx_motor_torque_kgcm: 18.0
  mjx_arm_action_scale: 0.1
  mjx_leg_action_scale: 0.1
  mjx_other_action_scale: 0.1
  mjx_control_slew_rad_s: 8.0
  mjx_step_clearance_m: 0.015
  mjx_gait_residual: true
  mjx_scripted_gait: envs/mjx_walking/assets/humanlike_gait.npz
  mjx_scripted_phase_pool: envs/mjx_walking/assets/humanlike_phase_pool.npz
  mjx_stabilizer: [1.0, 0.04, -1.0, 0.25]
  mjx_phase_obs: true
  rsi_stratified: true
  rsi_probabilities: [0.15, 0.0, 0.0, 0.85]
  rsi_reference_velocity: true
  pose_rsi_json: null
  gait_reference_csv: null
  gait_reference_signs: null
  pose_rsi_allow_falls: false
  gait_reference_speed: 1.0
  mjx_alive_bonus: 0.5
  mjx_fall_penalty: 150
  mjx_landing_weight: 10
  mjx_first_step_bonus: 20
  mjx_goal_bonus: 500
  mjx_stall_out_penalty: 30
  mjx_stall_out_seconds: 20
  mjx_stall_grace_seconds: 8
  mjx_still_pays: 0
  mjx_action_weight: 10
  mjx_lateral_scale: 0.08
  mjx_footsteps: true
  mjx_dot_step: 0.05
  mjx_dot_radius: 0.025
  mjx_dot_first_side: -1
  mjx_dot_first_from_toe: 0.05
  mjx_dot_toe_target: true
  mjx_dot_end_on_success: false

model:
  warmup: 100
  compile: false
  mixed_precision: false
  actor:
    dist:
      cont: {min_std: 0.005, max_std: 0.03}

buffer:
  max_size: 131072
  cache_trajectories: true
  store_log_metrics: false

trainer:
  require_learning: true
  learning_start_deadline_steps: 256000
  stop_after_optimizer_updates: 0
  eval_every: 100000
  eval_max_steps: 1000
  checkpoint_interval: 100000
  checkpoint_keep_last: 3
  checkpoint_order: safety_first
  best_metric_key: total_valid_steps
  best_safety_metric_key: safety_failure_count
  best_tiebreak_metric_key: alternating_steps
  profile_synchronize: false
  eval_video: true
  eval_video_one_per_pose: false
  eval_video_every: 100000
  eval_video_save_mp4: true
  eval_video_tensorboard: false
  eval_video_width: 320
  eval_video_height: 240
  eval_video_stride: 2
  eval_video_fps: 25
  train_video: false
  video_pred_log: false
