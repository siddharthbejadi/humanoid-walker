[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "r2dreamer-mjx-teacher"
version = "0.1.0"
description = "Teacher-only R2Dreamer experiment using GPU MJX-Warp"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.8.0",
    "torchrl==0.9.2",
    "tensordict==0.9.1",
    "ruamel.yaml==0.17.4",
    "moviepy==1.0.3",
    "einops==0.3.0",
    "numpy>=2.0,<3.0",
    "hydra-core==1.3.2",
    "gymnasium==1.2.0",
    "tensorboard>=2.20,<3",
    "setuptools==77.0.3",
]

[project.optional-dependencies]
"mjx-teacher" = [
    "mujoco==3.14.0",
    "mujoco-mjx[warp]==3.14.0",
    "brax==0.14.2",
    "jax[cuda12]",
]

[tool.setuptools.packages.find]
include = ["envs*", "optim*"]
